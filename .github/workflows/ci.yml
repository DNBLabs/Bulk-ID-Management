# Default validate-only CI (CONTEXT / SEC): pwsh, PSScriptAnalyzer (Error+Warning), Pester.
# Parallel jobs reduce wall-clock time; ci-success aggregates for a single required status check.
# Does not call Microsoft Graph APIs. Gallery install of Microsoft.Graph runs only when a module
# manifest exists, solely so Test-ModuleManifest can resolve RequiredModules (no Connect-MgGraph).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer (Error and Warning fail build)
        run: ./.github/scripts/Invoke-PSScriptAnalyzerCI.ps1

  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable

      - name: Install Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester
        run: Invoke-Pester -Path ./tests -CI

  module-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable

      - name: Test module manifest (when module layout is present)
        run: ./.github/scripts/Invoke-ModuleManifestCI.ps1

  ci-success:
    runs-on: ubuntu-latest
    needs: [psscriptanalyzer, pester, module-manifest]
    if: success()
    steps:
      - name: All CI gates passed
        run: Write-Host 'PSScriptAnalyzer, Pester, and module-manifest steps completed successfully.'
