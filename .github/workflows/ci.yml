# Default validate-only CI (CONTEXT / SEC): pwsh, PSScriptAnalyzer (Error+Warning), Pester.
# Does not call Microsoft Graph APIs. Gallery install of Microsoft.Graph runs only when a module
# manifest exists, solely so Test-ModuleManifest can resolve RequiredModules (no Connect-MgGraph).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: actions/setup-powershell@v2
        with:
          version: '7.4'

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer (Error and Warning fail build)
        shell: pwsh
        run: ./.github/scripts/Invoke-PSScriptAnalyzerCI.ps1

      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI

      - name: Test module manifest (when module layout is present)
        shell: pwsh
        run: |
          $manifest = Join-Path $PWD 'src/Modules/BulkIdentityManagement/BulkIdentityManagement.psd1'
          if (-not (Test-Path -LiteralPath $manifest)) {
            Write-Host 'No module manifest in repository; skipping Test-ModuleManifest and Graph gallery install.'
            exit 0
          }
          $pinPath = Join-Path $PWD 'docs/tasks/MicrosoftGraph.psgallery.version.txt'
          if (-not (Test-Path -LiteralPath $pinPath)) {
            throw "Pin record missing at docs/tasks/MicrosoftGraph.psgallery.version.txt (required for manifest validation)."
          }
          $ver = (Get-Content -LiteralPath $pinPath -Raw).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Pin record must be a single numeric x.y.z line; got: $ver"
          }
          Install-Module -Name Microsoft.Graph -RequiredVersion $ver -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
          Test-ModuleManifest -Path $manifest -ErrorAction Stop
